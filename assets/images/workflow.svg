<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 260" role="img" aria-labelledby="title desc"><title id="title">AIquainted human-reviewed workflow</title><desc id="desc">Verified inputs move to controlled drafts, then fact voice and privacy review, and finally human approval.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#176b57"/></marker></defs><g fill="none" stroke="#176b57" stroke-width="3" marker-end="url(#arrow)"><path d="M268 130H318"/><path d="M538 130H588"/><path d="M808 130H858"/></g><g font-family="Inter,system-ui,sans-serif"><g><rect x="28" y="48" width="240" height="164" rx="8" fill="#e8f2ee" stroke="#9bbcb1"/><text x="54" y="83" fill="#176b57" font-size="14" font-weight="800">01 · INPUTS</text><text x="54" y="120" fill="#14221f" font-size="23" font-weight="800">Verified notes</text><text x="54" y="151" fill="#53615d" font-size="15"><tspan x="54">Redacted facts, dates,</tspan><tspan x="54" dy="23">terms, and approved links</tspan></text></g><g><rect x="318" y="48" width="220" height="164" rx="8" fill="#fff5d8" stroke="#dcc88d"/><text x="344" y="83" fill="#8a6200" font-size="14" font-weight="800">02 · DRAFTS</text><text x="344" y="120" fill="#14221f" font-size="23" font-weight="800">Controlled copy</text><text x="344" y="151" fill="#53615d" font-size="15"><tspan x="344">Clear format, constraints,</tspan><tspan x="344" dy="23">and unknowns flagged</tspan></text></g><g><rect x="588" y="48" width="220" height="164" rx="8" fill="#f1eee2" stroke="#c9c4b4"/><text x="614" y="83" fill="#6b6249" font-size="14" font-weight="800">03 · REVIEW</text><text x="614" y="120" fill="#14221f" font-size="23" font-weight="800">Check the work</text><text x="614" y="151" fill="#53615d" font-size="15"><tspan x="614">Facts, voice, privacy,</tspan><tspan x="614" dy="23">promises, and links</tspan></text></g><g><rect x="858" y="48" width="234" height="164" rx="8" fill="#176b57" stroke="#176b57"/><text x="884" y="83" fill="#dff36b" font-size="14" font-weight="800">04 · APPROVAL</text><text x="884" y="120" fill="#fff" font-size="23" font-weight="800">Human decision</text><text x="884" y="151" fill="#d7e6e0" font-size="15"><tspan x="884">Correct, approve, and</tspan><tspan x="884" dy="23">publish—or stop</tspan></text></g></g></svg>